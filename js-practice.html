<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>JS基础知识练习</title>
</head>
<body>
    <h1>JavaScript 基础练习</h1>

    <script>
        // 1. 变量的定义
        let name = "小明";
        const age = 20;
        var isStudent = true;

        // 2. 变量类型
        console.log("字符串类型：", name, typeof name);
        console.log("数字类型：", age, typeof age);
        console.log("布尔类型：", isStudent, typeof isStudent);
        console.log("空类型：", null, typeof null);
        console.log("未定义类型：", undefined, typeof undefined);

        // 3. 表达式
        let num1 = 10;
        let num2 = 3;
        console.log("加法：", num1 + num2);
        console.log("减法：", num1 - num2);
        console.log("乘法：", num1 * num2);
        console.log("除法：", num1 / num2);
        console.log("取模：", num1 % num2);
        console.log("拼接：", name + "今年" + age + "岁");

        // 4. 流程控制（if/for/while）
        // if 判断
        if (age >= 18) {
            console.log("成年了");
        } else {
            console.log("未成年");
        }

        // for 循环
        console.log("for 循环 1~5：");
        for (let i = 1; i <= 5; i++) {
            console.log(i);
        }

        // while 循环
        console.log("while 循环 1~3：");
        let count = 1;
        while (count <= 3) {
            console.log(count);
            count++;
        }

        // 5. 函数
        function add(a, b) {
            return a + b;
        }

        let result = add(5, 7);
        console.log("函数调用结果：", result);

        // 页面输出结果，方便查看
        document.write("<p>变量定义、类型、表达式、流程控制、函数均已练习完成，请打开浏览器控制台查看详细输出！</p >");
    </script>
</body>
</html>
